name: Deploy to JKC (cPanel UAPI - ZIP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (semua — Next.js build butuh devDeps juga)
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client (semua binary targets dari schema.prisma)
        run: npx prisma generate

      - name: Apply pending Prisma migrations to JKC Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "DATABASE_URL set: $([[ -n "${DATABASE_URL}" ]] && echo yes || echo NO)"
          echo "DIRECT_URL set:   $([[ -n "${DIRECT_URL}" ]] && echo yes || echo NO)"
          if [[ -z "${DATABASE_URL}" || -z "${DIRECT_URL}" ]]; then
            echo "::warning::DATABASE_URL atau DIRECT_URL belum diset di GitHub Secrets."
            echo "  → Settings → Secrets and variables → Actions → tambah 2 secret ini"
            echo "  → Sementara, code baru tetap di-upload; migration apply manual via:"
            echo "  →   cPanel Terminal: cd /home/keluhkam/... && DATABASE_URL=... DIRECT_URL=... npx prisma migrate deploy"
            exit 0
          fi
          # Coba migrate; kalau gagal, log jelas tapi JANGAN block build+upload.
          set +e
          npx prisma migrate deploy --schema prisma/schema.prisma 2>&1 | tee /tmp/migrate.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::prisma migrate deploy gagal (exit $rc). Lanjut upload bundle."
            echo "  → Cek /tmp/migrate.log di workflow artifacts, atau run manual di server."
          fi
          exit 0

      - name: Build Next.js standalone
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
          AI_REPORT_TIMEOUT_MS: "25000"
          REFERENCE_CACHE_ADMIN_TOKEN: ${{ secrets.REFERENCE_CACHE_ADMIN_TOKEN }}
        run: npm run build

      - name: Prepare & zip deploy bundle
        run: |
          rm -rf deploy bundle.zip
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt
          # .next/standalone/ SUDAH self-contained: ada server.js, node_modules produksi
          # (argon2/prisma prebuilds), prisma/, package.json. Tinggal tambah .next/static
          # (untuk _next/static/* assets) + public/ (untuk favicon, robots.txt, dll).
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          echo "Bundle sources:"
          echo "  .next/standalone/: $(du -sh .next/standalone | cut -f1)"
          echo "  .next/static:     $(du -sh .next/static | cut -f1)"
          echo "  public:           $(du -sh public | cut -f1)"
          cd deploy
          zip -qr ../bundle.zip .
          cd ..
          echo "Bundle zip size: $(du -sh bundle.zip | cut -f1)"

      - name: Upload ZIP via cPanel UAPI (Fileman::upload_files)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          set +e
          echo "CPANEL_DIR=${CPANEL_DIR}"
          echo "Bundle zip size: $(du -sh bundle.zip | cut -f1) (raw bytes: $(stat -c%s bundle.zip))"
          # Diagnostic: list server dir sebelum upload
          echo "--- pre-upload list ${CPANEL_DIR} ---"
          pre=$(curl -sS -w "\nHTTP=%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/list_files?dir=${CPANEL_DIR}&limit=500")
          echo "${pre}" | head -c 2000
          echo ""
          echo "--- end pre-upload ---"
          # Upload via Fileman
          echo "Uploading bundle.zip to ${CPANEL_DIR}..."
          http_code=$(curl -sS -o /tmp/upload_resp -w "%{http_code}" \
            -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -F "file=@bundle.zip" \
            -F "dir=${CPANEL_DIR}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files")
          upload_exit=$?
          upload_body=$(cat /tmp/upload_resp)
          echo "Upload: HTTP=${http_code} curl_exit=${upload_exit}"
          echo "Response body: ${upload_body}"
          # Verifikasi upload landing
          sleep 1
          post=$(curl -sS -w "\nHTTP=%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/list_files?dir=${CPANEL_DIR}&limit=500")
          echo "--- post-upload list ${CPANEL_DIR} ---"
          echo "${post}" | head -c 2000
          echo ""
          bundle_found="no"
          if echo "${post}" | grep -q '"name":"bundle.zip"'; then
            bundle_found="yes"
            echo "✓ bundle.zip landing di ${CPANEL_DIR}"
          else
            # Fallback ke alt-dir
            ALT_DIR="/home/${CPANEL_USER}/public_html/${CPANEL_DIR##*/}"
            if [[ "${ALT_DIR}" != "${CPANEL_DIR}" ]]; then
              echo "--- check alt dir ${ALT_DIR} ---"
              alt=$(curl -sS \
                -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                "https://${CPANEL_HOST}:2083/execute/Fileman/list_files?dir=${ALT_DIR}&limit=500")
              echo "${alt}" | head -c 1500
              echo ""
              if echo "${alt}" | grep -q '"name":"bundle.zip"'; then
                bundle_found="yes"
                echo "✓ bundle.zip di ${ALT_DIR}"
              fi
            fi
          fi
          # Write diagnostic ke public_html agar bisa di-fetch via HTTP
          DIAG_PATH="${CPANEL_DIR}/deploy-diag.txt"
          cat > /tmp/diag_content <<EOF
CPANEL_DIR=${CPANEL_DIR}
bundle_size_bytes=$(stat -c%s bundle.zip)
upload_http=${http_code}
upload_exit=${upload_exit}
upload_body=${upload_body}
bundle_found_in_listing=${bundle_found}
pre_listing=$(echo "${pre}" | head -c 500 | tr '\n' ' ')
post_listing=$(echo "${post}" | head -c 500 | tr '\n' ' ')
EOF
          curl -sS -o /tmp/diag_resp -w "diag HTTP %{http_code}\n" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${CPANEL_DIR}" \
            --data-urlencode "file=deploy-diag.txt" \
            --data-urlencode "content@/tmp/diag_content" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file"
          cat /tmp/diag_resp
          echo ""
          if [[ "${bundle_found}" != "yes" ]]; then
            echo "::error::bundle.zip TIDAK landing. HTTP=${http_code} body=${upload_body}"
            echo "  → Diag ditulis ke ${DIAG_PATH} (fetch via https://keluhkampus.my.id/deploy-diag.txt)"
            exit 1
          fi

      - name: Extract bundle.zip via cPanel UAPI (no cron dependency)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          echo "CPANEL_DIR=${CPANEL_DIR}"
          # Cari bundle.zip di CPANEL_DIR atau di public_html/<basename>/ — JKC DocumentRoot
          # = public_html/, Passenger serve dari public_html/keluhkampus.my.id/. Kalau
          # CPANEL_DIR adalah /home/keluhkam/keluhkampus.my.id (tanpa public_html), upload
          # & extract ke path itu artinya Passenger tidak baca sama sekali.
          BASENAME="${CPANEL_DIR##*/}"   # "keluhkampus.my.id"
          ALT_DIR="/home/${CPANEL_USER}/public_html/${BASENAME}"
          echo "ALT_DIR=${ALT_DIR}"
          find_zip=""
          for d in "${CPANEL_DIR}" "${ALT_DIR}"; do
            echo "--- probing ${d} ---"
            r=$(curl -sS \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/Fileman/list_files?dir=${d}&limit=500")
            echo "${r}" | head -c 1500
            echo ""
            if echo "${r}" | grep -q '"name":"bundle.zip"'; then
              find_zip="${d}"
              echo "✓ bundle.zip ditemukan di ${d}"
              break
            fi
          done
          if [[ -z "${find_zip}" ]]; then
            echo "::warning::bundle.zip tidak ada di CPANEL_DIR maupun public_html/ — cek upload step."
            exit 0
          fi
          # Extract via UAPI
          echo "Extracting ${find_zip}/bundle.zip via Fileman::uncompress..."
          http_code=$(curl -sS -o /tmp/extract_resp -w "%{http_code}" \
            -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "type=zip" \
            --data-urlencode "sourcefile=${find_zip}/bundle.zip" \
            --data-urlencode "file=${find_zip}" \
            --data-urlencode "destdir=${find_zip}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/uncompress")
          echo "Extract HTTP $http_code"
          cat /tmp/extract_resp
          echo ""
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Fileman::uncompress gagal (HTTP $http_code). Cek response di atas."
            exit 1
          fi
          # Verify node_modules muncul
          sleep 2
          verify_resp=$(curl -sS \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/list_files?dir=${find_zip}&limit=500")
          if ! echo "$verify_resp" | grep -q '"name":"node_modules"'; then
            echo "::warning::Extract selesai tapi node_modules tidak terlihat. Cek manual."
            exit 1
          fi
          echo "✓ Extract OK — node_modules present di ${find_zip}"
          # Hapus bundle.zip setelah sukses (cleanup)
          curl -sS -o /tmp/rm_resp -w "Delete HTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "files=${find_zip}/bundle.zip" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/delete_files" || true
          cat /tmp/rm_resp 2>/dev/null || true
          echo ""

      - name: Trigger Passenger restart
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          echo "Touching tmp/restart.txt to restart Passenger..."
          # Ensure tmp dir exists first
          curl -sS -o /tmp/mkdir_tmp -w "mkdir tmp HTTP %{http_code}\n" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/dir?dir=${CPANEL_DIR}/tmp" || true
          http_code=$(curl -sS -o /tmp/restart_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${CPANEL_DIR}/tmp" \
            --data-urlencode "file=restart.txt" \
            --data-urlencode "content=" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          cat /tmp/restart_resp
          echo ""
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to trigger Passenger restart - HTTP $http_code"
            exit 1
          fi

      - name: Write .env to server
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
          REFERENCE_CACHE_ADMIN_TOKEN: ${{ secrets.REFERENCE_CACHE_ADMIN_TOKEN }}
          UPLOAD_DIR: /home/keluhkam/public_html/keluhkampus.my.id/uploads
        run: |
          echo "Writing .env to ${CPANEL_DIR}/.env..."
          {
            echo "NODE_ENV=${NODE_ENV}"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DIRECT_URL=${DIRECT_URL}"
            echo "AUTH_JWT_SECRET=${AUTH_JWT_SECRET}"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "AI_API_KEY=${AI_API_KEY}"
            echo "AI_BASE_URL=${AI_BASE_URL}"
            echo "AI_MODEL=${AI_MODEL}"
            echo "AI_MODEL_FAST=${AI_MODEL_FAST}"
            echo "AI_MODEL_REVIEW=${AI_MODEL_REVIEW}"
            echo "REFERENCE_CACHE_ADMIN_TOKEN=${REFERENCE_CACHE_ADMIN_TOKEN}"
            echo "UPLOAD_DIR=${UPLOAD_DIR}"
            echo "PORT=3000"
            echo "HOSTNAME=0.0.0.0"
          } > /tmp/env_content
          echo "--- env preview ---"
          cat /tmp/env_content
          echo "--- end ---"
          http_code=$(curl -sS -o /tmp/env_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${CPANEL_DIR}" \
            --data-urlencode "file=.env" \
            --data-urlencode "content@/tmp/env_content" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          cat /tmp/env_resp
          echo ""
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to write .env - HTTP $http_code"
            exit 1
          fi

      - name: Write public_html/.htaccess (reverse proxy ke Node:3000)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
        run: |
          echo "Writing public_html/.htaccess (Apache reverse proxy ke Node)..."
          http_code=$(curl -sS -o /tmp/htaccess_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=/public_html" \
            --data-urlencode "file=.htaccess" \
            --data-urlencode "content@public/.htaccess" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          cat /tmp/htaccess_resp
          echo ""
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to write public_html/.htaccess"
            exit 1
          fi

      - name: Health check
        run: |
          sleep 20
          echo "Checking https://keluhkampus.my.id/"
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://keluhkampus.my.id/ \
            || echo "::warning::Health check failed"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
