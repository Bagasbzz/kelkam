name: Deploy to JKC (cPanel UAPI - ZIP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (semua — Next.js build butuh devDeps juga)
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client (semua binary targets dari schema.prisma)
        run: npx prisma generate

      - name: Apply pending Prisma migrations to JKC Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "DATABASE_URL set: $([[ -n "${DATABASE_URL}" ]] && echo yes || echo NO)"
          echo "DIRECT_URL set:   $([[ -n "${DIRECT_URL}" ]] && echo yes || echo NO)"
          if [[ -z "${DATABASE_URL}" || -z "${DIRECT_URL}" ]]; then
            echo "::warning::DATABASE_URL atau DIRECT_URL belum diset di GitHub Secrets."
            echo "  → Settings → Secrets and variables → Actions → tambah 2 secret ini"
            echo "  → Sementara, code baru tetap di-upload; migration apply manual via:"
            echo "  →   cPanel Terminal: cd /home/keluhkam/... && DATABASE_URL=... DIRECT_URL=... npx prisma migrate deploy"
            exit 0
          fi
          # Coba migrate; kalau gagal, log jelas tapi JANGAN block build+upload.
          set +e
          npx prisma migrate deploy --schema prisma/schema.prisma 2>&1 | tee /tmp/migrate.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::prisma migrate deploy gagal (exit $rc). Lanjut upload bundle."
            echo "  → Cek /tmp/migrate.log di workflow artifacts, atau run manual di server."
          fi
          exit 0

      - name: Build Next.js standalone
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
          AI_REPORT_TIMEOUT_MS: "25000"
          REFERENCE_CACHE_ADMIN_TOKEN: ${{ secrets.REFERENCE_CACHE_ADMIN_TOKEN }}
        run: npm run build

      - name: Prepare & zip deploy bundle
        run: |
          rm -rf deploy bundle.zip
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt
          # .next/standalone/ SUDAH self-contained: ada server.js, node_modules produksi
          # (argon2/prisma prebuilds), prisma/, package.json. Tinggal tambah .next/static
          # (untuk _next/static/* assets) + public/ (untuk favicon, robots.txt, dll).
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          echo "Bundle sources:"
          echo "  .next/standalone/: $(du -sh .next/standalone | cut -f1)"
          echo "  .next/static:     $(du -sh .next/static | cut -f1)"
          echo "  public:           $(du -sh public | cut -f1)"
          cd deploy
          zip -qr ../bundle.zip .
          cd ..
          echo "Bundle zip size: $(du -sh bundle.zip | cut -f1)"

      - name: Upload ZIP via cPanel UAPI (chunked save_file → PHP decoder)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          set +e
          DOC_ROOT="/home/${CPANEL_USER}/public_html"
          echo "CPANEL_DIR=${CPANEL_DIR}"
          echo "DOC_ROOT=${DOC_ROOT}"
          bundle_bytes=$(stat -c%s bundle.zip)
          echo "Bundle zip size: $(du -sh bundle.zip | cut -f1) (raw bytes: ${bundle_bytes})"

          # STRATEGY: bypass Fileman::upload_files (silently drops large files via PHP
          # upload limits). Upload bundle.zip as base64 in 4MB text chunks via
          # Fileman::save_file (no PHP multipart, no upload limit). Then a tiny PHP
          # script in DocRoot decodes → writes zip → uncompresses → triggers restart.

          # 1) Base64-encode locally + split into 4MB chunks.
          base64 -w 0 bundle.zip > /tmp/bundle.b64
          b64_bytes=$(stat -c%s /tmp/bundle.b64)
          CHUNK_SIZE=$((4 * 1024 * 1024))   # 4 MB per chunk — safely under any limit
          NUM_CHUNKS=$(( (b64_bytes + CHUNK_SIZE - 1) / CHUNK_SIZE ))
          echo "base64 size: ${b64_bytes} bytes → ${NUM_CHUNKS} chunks of ${CHUNK_SIZE} bytes"

          split -b ${CHUNK_SIZE} -d -a 3 /tmp/bundle.b64 /tmp/chunk_
          ls -la /tmp/chunk_*

          # 2) Upload each chunk to DocRoot as bundle.zip.b64.NNN (PUBLIC path).
          UPLOAD_OK=1
          for chunk in /tmp/chunk_*; do
            idx="${chunk##*_}"
            echo "--- uploading chunk ${idx} ---"
            up_http=$(curl -sS -o /tmp/c_resp -w "%{http_code}" \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "dir=${DOC_ROOT}" \
              --data-urlencode "file=bundle.zip.b64.${idx}" \
              --data-urlencode "content@${chunk}" \
              --data-urlencode "encoding=utf-8" \
              "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
            up_body=$(cat /tmp/c_resp)
            echo "chunk ${idx} HTTP=${up_http} body=${up_body:0:200}"
            if [[ "${up_http}" != "200" ]]; then
              echo "::error::chunk ${idx} upload failed HTTP=${up_http}"
              UPLOAD_OK=0
              break
            fi
          done

          # 3) Write a tiny PHP decoder to DocRoot (publicly fetchable, runs under Apache).
          # Uses PHP ZipArchive (built-in) — no shell_exec needed (cPanel usually disables it).
          cat > /tmp/decoder.php <<'PHP'
          <?php
          // decoder.php?token=SECRET — concat base64 chunks → decode → ZipArchive extract → touch restart.txt
          header('Content-Type: text/plain; charset=utf-8');
          $DOC_ROOT = '/home/keluhkam/public_html';
          $CPANEL_DIR = '/home/keluhkam/public_html/keluhkampus.my.id';
          $SECRET = '__DEPLOY_SECRET__';
          $tok = $_GET['token'] ?? '';
          if (!hash_equals($SECRET, $tok)) { http_response_code(403); echo "forbidden"; exit; }
          @set_time_limit(300);
          function delTree($d) {
              if (!is_dir($d)) return @unlink($d);
              foreach (scandir($d) as $f) {
                  if ($f === '.' || $f === '..') continue;
                  $p = $d . '/' . $f;
                  is_dir($p) ? delTree($p) : @unlink($p);
              }
              return @rmdir($d);
          }
          $b64 = '';
          for ($i = 0; $i < 1000; $i++) {
              $f = $DOC_ROOT . '/bundle.zip.b64.' . str_pad((string)$i, 3, '0', STR_PAD_LEFT);
              if (!file_exists($f)) break;
              $b64 .= file_get_contents($f);
              unlink($f);
          }
          if ($b64 === '') { http_response_code(500); echo "no chunks"; exit; }
          $zip_bytes = base64_decode($b64, true);
          if ($zip_bytes === false) { http_response_code(500); echo "base64 decode failed"; exit; }
          $tmp_zip = '/tmp/bundle_' . getmypid() . '.zip';
          if (file_put_contents($tmp_zip, $zip_bytes) === false) {
              http_response_code(500); echo "write tmp failed"; exit;
          }
          echo "wrote tmp zip " . strlen($zip_bytes) . " bytes\n";
          if (!class_exists('ZipArchive')) {
              http_response_code(500); echo "ZipArchive missing"; exit;
          }
          $za = new ZipArchive();
          if ($za->open($tmp_zip) !== true) {
              http_response_code(500); echo "zip open failed"; exit;
          }
          // Clean app dir first (remove stale files from previous bundle, but keep .env,
          // uploads/, tmp/).
          $keep = ['.env', 'uploads', 'tmp'];
          $dh = @opendir($CPANEL_DIR);
          if ($dh) {
              while (($f = readdir($dh)) !== false) {
                  if ($f === '.' || $f === '..') continue;
                  if (in_array($f, $keep, true)) continue;
                  $p = $CPANEL_DIR . '/' . $f;
                  if (is_dir($p)) delTree($p); else @unlink($p);
              }
              closedir($dh);
          }
          $ok = $za->extractTo($CPANEL_DIR);
          $za->close();
          @unlink($tmp_zip);
          echo $ok ? "extracted OK\n" : "extract failed\n";
          // Touch Passenger restart sentinel.
          @mkdir($CPANEL_DIR . '/tmp', 0777, true);
          @touch($CPANEL_DIR . '/tmp/restart.txt');
          echo "done\n";
          PHP

          # Substitute deploy secret
          DEPLOY_SECRET=$(openssl rand -hex 16)
          sed -i "s/__DEPLOY_SECRET__/${DEPLOY_SECRET}/" /tmp/decoder.php
          # Persist the secret for the trigger step via file
          echo -n "${DEPLOY_SECRET}" > /tmp/deploy_secret

          dec_http=$(curl -sS -o /tmp/dec_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${DOC_ROOT}" \
            --data-urlencode "file=decoder.php" \
            --data-urlencode "content@/tmp/decoder.php" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "decoder.php HTTP=${dec_http}"
          cat /tmp/dec_resp
          echo ""

          # 4) Hit decoder.php via HTTP to actually decode + extract + restart.
          if [[ "${UPLOAD_OK}" == "1" && "${dec_http}" == "200" ]]; then
            echo "--- triggering decoder ---"
            SECRET=$(cat /tmp/deploy_secret)
            curl -sS -w "\nHTTP %{http_code}\n" \
              "https://keluhkampus.my.id/decoder.php?token=${SECRET}"
          fi

          # 5) Cleanup decoder + diag fetch + remove decoder after use.
          sleep 2
          rm /tmp/deploy_secret
          # Delete decoder.php after run (clean state for next deploy)
          curl -sS -o /dev/null \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "files=${DOC_ROOT}/decoder.php" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/delete_files" || true

          # Final diag to DocRoot for verification
          {
            printf 'chunks_uploaded=%s\n' "${NUM_CHUNKS}"
            printf 'b64_size=%s\n' "${b64_bytes}"
            printf 'bundle_zip_bytes=%s\n' "${bundle_bytes}"
            printf 'upload_ok=%s\n' "${UPLOAD_OK}"
            printf 'decoder_write_http=%s\n' "${dec_http}"
          } > /tmp/diag_content
          curl -sS -o /dev/null -w "diag HTTP %{http_code}\n" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${DOC_ROOT}" \
            --data-urlencode "file=deploy-diag.txt" \
            --data-urlencode "content@/tmp/diag_content" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file"

          if [[ "${UPLOAD_OK}" != "1" ]]; then
            echo "::error::Some chunks failed to upload. See diag."
            exit 1
          fi

      - name: Trigger Passenger restart (fallback if decoder.php didn't run restart)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          echo "Touching tmp/restart.txt to restart Passenger..."
          # Ensure tmp dir exists first
          curl -sS -o /tmp/mkdir_tmp -w "mkdir tmp HTTP %{http_code}\n" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/dir?dir=${CPANEL_DIR}/tmp" || true
          http_code=$(curl -sS -o /tmp/restart_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${CPANEL_DIR}/tmp" \
            --data-urlencode "file=restart.txt" \
            --data-urlencode "content=" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          cat /tmp/restart_resp
          echo ""
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to trigger Passenger restart - HTTP $http_code"
            exit 1
          fi

      - name: Write .env to server
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
          REFERENCE_CACHE_ADMIN_TOKEN: ${{ secrets.REFERENCE_CACHE_ADMIN_TOKEN }}
          UPLOAD_DIR: /home/keluhkam/public_html/keluhkampus.my.id/uploads
        run: |
          echo "Writing .env to ${CPANEL_DIR}/.env..."
          {
            echo "NODE_ENV=${NODE_ENV}"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DIRECT_URL=${DIRECT_URL}"
            echo "AUTH_JWT_SECRET=${AUTH_JWT_SECRET}"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "AI_API_KEY=${AI_API_KEY}"
            echo "AI_BASE_URL=${AI_BASE_URL}"
            echo "AI_MODEL=${AI_MODEL}"
            echo "AI_MODEL_FAST=${AI_MODEL_FAST}"
            echo "AI_MODEL_REVIEW=${AI_MODEL_REVIEW}"
            echo "REFERENCE_CACHE_ADMIN_TOKEN=${REFERENCE_CACHE_ADMIN_TOKEN}"
            echo "UPLOAD_DIR=${UPLOAD_DIR}"
            echo "PORT=3000"
            echo "HOSTNAME=0.0.0.0"
          } > /tmp/env_content
          echo "--- env preview ---"
          cat /tmp/env_content
          echo "--- end ---"
          http_code=$(curl -sS -o /tmp/env_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${CPANEL_DIR}" \
            --data-urlencode "file=.env" \
            --data-urlencode "content@/tmp/env_content" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          cat /tmp/env_resp
          echo ""
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to write .env - HTTP $http_code"
            exit 1
          fi

      - name: Write public_html/.htaccess (reverse proxy ke Node:3000)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
        run: |
          echo "Writing public_html/.htaccess (Apache reverse proxy ke Node)..."
          http_code=$(curl -sS -o /tmp/htaccess_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=/public_html" \
            --data-urlencode "file=.htaccess" \
            --data-urlencode "content@public/.htaccess" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          cat /tmp/htaccess_resp
          echo ""
          if [[ "$http_code" != "200" ]]; then
            echo "::error::Failed to write public_html/.htaccess"
            exit 1
          fi

      - name: Health check
        run: |
          sleep 20
          echo "Checking https://keluhkampus.my.id/"
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://keluhkampus.my.id/ \
            || echo "::warning::Health check failed"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
