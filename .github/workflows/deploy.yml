name: Deploy to JKC (cPanel UAPI)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npx prisma generate

      - name: Build Next.js standalone
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
          AI_REPORT_TIMEOUT_MS: "25000"
          REFERENCE_CACHE_ADMIN_TOKEN: ${{ secrets.REFERENCE_CACHE_ADMIN_TOKEN }}
        run: npm run build

      - name: Prepare deploy bundle
        run: |
          rm -rf deploy
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          cp -r prisma deploy/prisma
          cp package.json deploy/package.json
          cp server.js deploy/server.js
          echo "Bundle: $(du -sh deploy | cut -f1)"
          echo "Files: $(find deploy -type f | wc -l)"

      - name: Upload via cPanel UAPI
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          set -e
          cd deploy

          # Build list of relative file paths
          mapfile -t FILES < <(find . -type f -not -path './tmp/*' | sed 's|^\./||')
          echo "Uploading ${#FILES[@]} files to ${CPANEL_HOST}${CPANEL_DIR}"

          i=0
          for rel in "${FILES[@]}"; do
            i=$((i+1))
            dir=$(dirname "$rel")
            http_code=$(curl -sS -o /tmp/last_resp -w "%{http_code}" \
              "https://${CPANEL_HOST}:2083/cpanel" \
              -u "${CPANEL_USER}:${CPANEL_TOKEN}" \
              --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
              --data-urlencode "cpanel_jsonapi_apiversion=2" \
              --data-urlencode "cpanel_jsonapi_module=Fileman" \
              --data-urlencode "cpanel_jsonapi_func=upload_files" \
              --data-urlencode "dir=${CPANEL_DIR}/${dir}" \
              --data-urlencode "file-1=@${rel};filename=${rel##*/}" \
              --data-urlencode "file-1-encoded=base64" \
              --data-urlencode "overwrite=1")

            if [[ "$http_code" != "200" ]]; then
              echo "FAIL ($i/${#FILES[@]}): $rel (HTTP $http_code)"
              cat /tmp/last_resp
              echo ""
              exit 1
            fi

            if (( i % 50 == 0 )); then
              echo "  $i/${#FILES[@]} uploaded..."
            fi
          done

          echo "Upload complete: $i files"

      - name: Trigger Passenger restart
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          echo "Triggering Passenger restart (touch tmp/restart.txt)..."
          curl -sS -o /tmp/restart_resp -w "HTTP %{http_code}\n" \
            "https://${CPANEL_HOST}:2083/cpanel" \
            -u "${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "cpanel_jsonapi_user=${CPANEL_USER}" \
            --data-urlencode "cpanel_jsonapi_apiversion=2" \
            --data-urlencode "cpanel_jsonapi_module=Fileman" \
            --data-urlencode "cpanel_jsonapi_func=upload_files" \
            --data-urlencode "dir=${CPANEL_DIR}/tmp" \
            --data-urlencode "file-1=@/dev/null;filename=restart.txt" \
            --data-urlencode "file-1-encoded=base64" \
            --data-urlencode "overwrite=1" || true
          cat /tmp/restart_resp 2>/dev/null || true

      - name: Health check
        run: |
          sleep 15
          echo "Checking https://keluhkampus.my.id/"
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://keluhkampus.my.id/ \
            || echo "::warning::Health check failed (app may still be starting or env vars missing)"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
