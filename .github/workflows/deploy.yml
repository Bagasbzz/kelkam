name: Deploy to JKC (cPanel UAPI - ZIP)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (semua — Next.js build butuh devDeps juga)
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client (semua binary targets dari schema.prisma)
        run: npx prisma generate

      - name: Apply pending Prisma migrations to JKC Postgres
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          echo "DATABASE_URL set: $([[ -n "${DATABASE_URL}" ]] && echo yes || echo NO)"
          echo "DIRECT_URL set:   $([[ -n "${DIRECT_URL}" ]] && echo yes || echo NO)"
          if [[ -z "${DATABASE_URL}" || -z "${DIRECT_URL}" ]]; then
            echo "::warning::DATABASE_URL atau DIRECT_URL belum diset di GitHub Secrets."
            exit 0
          fi
          set +e
          npx prisma migrate deploy --schema prisma/schema.prisma 2>&1 | tee /tmp/migrate.log
          rc=${PIPESTATUS[0]}
          set -e
          if [[ "$rc" -ne 0 ]]; then
            echo "::warning::prisma migrate deploy gagal (exit $rc). Lanjut upload bundle."
          fi
          exit 0

      - name: Build Next.js standalone
        env:
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
          AI_REPORT_TIMEOUT_MS: "25000"
          REFERENCE_CACHE_ADMIN_TOKEN: ${{ secrets.REFERENCE_CACHE_ADMIN_TOKEN }}
        run: npm run build

      - name: Slim bundle — drop unused Prisma engines / wasm / edge
        run: |
          # Schema generates 2 engines: "native" + "debian-openssl-1.1.x".
          # On GitHub Actions ubuntu-latest, "native" = debian-openssl-3.0.x.
          # JKC server needs debian-openssl-1.1.x (explicit in schema). Drop the 3.0.x.
          PRISMA_DIR=".next/standalone/node_modules/.prisma/client"
          KEEP_ENGINE="libquery_engine-debian-openssl-1.1.x.so.node"
          if [[ -d "$PRISMA_DIR" ]]; then
            for f in "$PRISMA_DIR"/*.so.node; do
              [[ -f "$f" ]] || continue
              base=$(basename "$f")
              if [[ "$base" != "$KEEP_ENGINE" ]]; then
                rm -f "$f"
                echo "  - removed: $base"
              else
                echo "  + kept:    $base"
              fi
            done
            # Drop Windows / WASM / edge / browser (JKC = Debian Linux Node, not edge runtime)
            for f in query_engine-windows.dll.node query_engine_bg.wasm edge.js index-browser.js; do
              if [[ -f "$PRISMA_DIR/$f" ]]; then
                rm -f "$PRISMA_DIR/$f"
                echo "  - removed: $f"
              fi
            done
            rm -f .next/standalone/node_modules/@prisma/client/runtime/edge-esm.js \
                  .next/standalone/node_modules/@prisma/client/runtime/edge.js 2>/dev/null || true
          else
            echo "::warning::$PRISMA_DIR not found — Prisma generate may have failed"
          fi

      - name: Prepare & zip deploy bundle
        run: |
          rm -rf deploy bundle-*.zip
          mkdir -p deploy/tmp
          touch deploy/tmp/restart.txt
          cp -r .next/standalone/. deploy/
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public
          echo "Bundle sources:"
          echo "  .next/standalone/: $(du -sh .next/standalone | cut -f1)"
          echo "  .next/static:     $(du -sh .next/static | cut -f1)"
          echo "  public:           $(du -sh public | cut -f1)"
          cd deploy
          zip -qr ../bundle.zip .
          cd ..
          # Rename ke nama unik per-run: cPanel upload_files nolak "bundle.zip"
          # meskipun probe 6 lokasi tidak menemukan file. Pasti internal cache.
          RUN_TAG="$(date +%s)-${GITHUB_RUN_ID}"
          mv bundle.zip "bundle-${RUN_TAG}.zip"
          echo "BUNDLE_FILE=bundle-${RUN_TAG}.zip" >> $GITHUB_ENV
          echo "Renamed → bundle-${RUN_TAG}.zip  ($(du -h bundle-${RUN_TAG}.zip | cut -f1))"

      - name: "10a — Diagnose FTP target (DNS / TCP / banner)"
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
        run: |
          echo "=== Secret values (sanitized) ==="
          echo "CPANEL_HOST=[${CPANEL_HOST}]  len=${#CPANEL_HOST}"
          echo ""
          echo "--- DNS lookup ---"
          getent hosts "${CPANEL_HOST}" 2>&1 || echo "(getent: no result)"
          nslookup "${CPANEL_HOST}" 2>&1 | tail -15
          echo ""
          echo "--- TCP port 21 probe ---"
          if timeout 10 bash -c "</dev/tcp/${CPANEL_HOST}/21"; then
            echo "TCP:21 reachable"
          else
            echo "::error::TCP:21 NOT reachable"
            exit 1
          fi
          echo ""
          echo "--- FTP banner (raw socket, no auth) ---"
          timeout 10 bash -c 'exec 3<>/dev/tcp/$0/$1; cat <&3 & sleep 2; kill %1 2>/dev/null; exec 3<&-' "${CPANEL_HOST}" 21 2>&1 || echo "(no banner)"

      - name: "10b — Upload ZIP via cPanel UAPI multipart (Fileman::upload_files)"
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
          BUNDLE_FILE: ${{ env.BUNDLE_FILE }}
        run: |
          exec > /tmp/step10b.log 2>&1
          set +x
          echo "Target dir=${CPANEL_DIR}  bundle_file=${BUNDLE_FILE}"
          BUNDLE_SIZE=$(stat -c %s "${BUNDLE_FILE}")
          echo "Bundle size: ${BUNDLE_SIZE} bytes"
          if [[ "${BUNDLE_SIZE}" -gt 90000000 ]]; then
            echo "::error::Bundle > 90MB, di atas limit PHP upload."
            exit 1
          fi
          # UPLOAD dengan nama unik (BUNDLE_FILE) — bypass cPanel "already exists" cache
          # untuk nama "bundle.zip" yang persistent secara internal.
          echo "--- upload ${BUNDLE_FILE} ---"
          http_code=$(curl -sS -o /tmp/upload_resp -w "%{http_code}" \
            -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -F "dir=${CPANEL_DIR}" \
            -F "file=@${BUNDLE_FILE}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/upload_files" 2> /tmp/upload_err)
          echo "HTTP ${http_code}"
          echo "--- upload_resp (first 500B) ---"
          head -c 500 /tmp/upload_resp
          echo ""
          echo "--- upload_err (last 20 lines) ---"
          tail -20 /tmp/upload_err 2>/dev/null
          if grep -qE '"failed"\s*:\s*[1-9]|"status"\s*:\s*0' /tmp/upload_resp; then
            echo "::error::UAPI upload_files gagal"
            echo "=== FULL step log head ==="
            head -200 /tmp/step10b.log
            exit 1
          fi
          # Upload succeed per API response. Extract step verifies server.js.
          echo "✓ UAPI upload_files reported succeeded — proceed to extract."

      - name: Probe UAPI Fileman::extract_archive (faster than per-file)
        id: probe_extract
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
        continue-on-error: true
        run: |
          echo "Probe UAPI Fileman extract functions..."
          for fn in extract_archive extract_files decompress_file extract unzip; do
            code=$(curl -sS -o /tmp/probe_${fn} -w "%{http_code}" \
              -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
              "https://${CPANEL_HOST}:2083/execute/Fileman/${fn}")
            body=$(head -c 150 /tmp/probe_${fn})
            echo "Fileman::${fn} → HTTP ${code}  body: ${body}"
            if [[ "$code" == "200" ]] && ! echo "$body" | grep -qE '"status"\s*:\s*0|"errors"\s*:\s*\[|unknown module'; then
              echo "FILEMAN_EXTRACT_FUNC=${fn}" >> $GITHUB_ENV
              echo "✓ Found working extract function: ${fn}"
              exit 0
            fi
          done
          echo "::warning::Tidak ada UAPI extract function yang work. Fallback ke per-file upload."
          echo "FILEMAN_EXTRACT_FUNC=" >> $GITHUB_ENV

      - name: Validate FTPS write access
        env:
          FTP_HOST: ${{ secrets.JKC_FTP_HOST }}
          FTP_USER: ${{ secrets.JKC_FTP_USER }}
          FTP_PASS: ${{ secrets.JKC_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          python3 - <<'PYEOF'
          import ftplib, os, sys
          host = os.environ["FTP_HOST"]
          try:
              ftp = ftplib.FTP_TLS(host, timeout=30)
              ftp.auth_tls()
              ftp.login(os.environ["FTP_USER"], os.environ["FTP_PASS"])
              print("✓ FTPS login OK")
              ftp.cwd(os.environ["FTP_DIR"])
              # Upload test file
              with open("/tmp/ftp_test.txt", "rb") as f:
                  ftp.storbinary("STOR .kk_ftp_probe", f)
              print("✓ FTPS STOR OK")
              # Cleanup
              try:
                  ftp.delete(".kk_ftp_probe")
                  print("✓ FTPS DELETE OK")
              except Exception as e:
                  print(f"delete failed: {e}")
              ftp.quit()
              print("FTP_VALIDATED=OK")
          except Exception as e:
              print(f"::error::FTPS validation failed: {e}")
              sys.exit(1)
          PYEOF

      - name: Upload diagnostic logs as artifact (always runs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostic
          path: |
            /tmp/upload_err
            /tmp/upload_resp
            /tmp/step10b.log
            /tmp/del_resp
          if-no-files-found: ignore

      - name: Recursive FTPS upload extracted bundle (primary path — fastest)
        if: env.FILEMAN_EXTRACT_FUNC == ''
        id: ftp_upload
        env:
          FTP_HOST: ${{ secrets.JKC_FTP_HOST }}
          FTP_USER: ${{ secrets.JKC_FTP_USER }}
          FTP_PASS: ${{ secrets.JKC_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.JKC_FTP_DIR }}
          BUNDLE_FILE: ${{ env.BUNDLE_FILE }}
        run: |
          set +e
          echo "Extract ${BUNDLE_FILE} locally, trim, then upload via FTPS (fast recursive)"
          rm -rf extracted
          mkdir -p extracted
          if ! unzip -q "${BUNDLE_FILE}" -d extracted/; then
            echo "::error::unzip lokal gagal"
            exit 1
          fi
          if [[ -f "extracted/server.js" ]]; then
            SRC="extracted"
          elif [[ -d "extracted/deploy" && -f "extracted/deploy/server.js" ]]; then
            SRC="extracted/deploy"
          else
            SRC=$(find extracted -name "server.js" -type f | head -1 | xargs dirname)
          fi
          echo "Using SRC=${SRC}"
          if [[ ! -f "${SRC}/server.js" ]]; then
            echo "::error::server.js tidak ada"
            exit 1
          fi
          echo "Trimming unused files..."
          find "${SRC}" -type f \( \
            -name "*.map" -o \
            -name "*.tsbuildinfo" -o \
            -name "*.md" -o \
            -name "*.bak" -o \
            -name "*.d.ts" -o \
            -path "*/node_modules/*/test/*" -o \
            -path "*/node_modules/*/tests/*" -o \
            -path "*/node_modules/*/changelog*" -o \
            -path "*/node_modules/*/CHANGELOG*" -o \
            -path "*/node_modules/*/readme.md" -o \
            -path "*/node_modules/*/README.md" -o \
            -path "*/node_modules/.bin" -o \
            -path "*/node_modules/*/man/*" -o \
            -path "*/node_modules/*/manpages/*" \
          \) -delete 2>/dev/null
          TOTAL=$(find "${SRC}" -type f | wc -l)
          echo "TOTAL=${TOTAL}" >> $GITHUB_ENV
          echo "Total files to upload (after trim): ${TOTAL}"
          export FTP_HOST FTP_USER FTP_PASS FTP_DIR SRC TOTAL
          python3 - <<'PYEOF'
          import ftplib, os, sys, time
          host = os.environ["FTP_HOST"]
          user = os.environ["FTP_USER"]
          pw = os.environ["FTP_PASS"]
          base_dir = os.environ["FTP_DIR"]
          src = os.environ["SRC"]
          total = int(os.environ.get("TOTAL", "0"))
          ok = 0
          fail = 0
          t0 = time.time()
          ftp = None
          try:
              ftp = ftplib.FTP_TLS(host, timeout=120)
              ftp.auth_tls()
              ftp.login(user, pw)
              try:
                  ftp.prot_p()
              except Exception:
                  pass
              print(f"Connected to {host}")
              ftp.cwd(base_dir)
              # Pre-create dir tree (top-down, mkdir if needed).
              dirs = set()
              for root, _, files in os.walk(src):
                  rel = os.path.relpath(root, src)
                  if rel != ".":
                      dirs.add(rel.replace(os.sep, "/"))
              print(f"Creating {len(dirs)} directories...")
              for d in sorted(dirs):
                  parts = d.split("/")
                  for p in parts:
                      try:
                          ftp.cwd(p)
                      except ftplib.error_perm:
                          try:
                              ftp.mkd(p)
                              ftp.cwd(p)
                          except Exception as e:
                              print(f"mkdir {p}: {e}")
                              break
              print(f"Uploading {total} files...")
              for root, _, files in os.walk(src):
                  rel = os.path.relpath(root, src)
                  for fn in files:
                      fpath = os.path.join(root, fn)
                      if rel == ".":
                          rpath = fn
                      else:
                          rpath = (rel + "/" + fn).replace(os.sep, "/")
                      try:
                          with open(fpath, "rb") as f:
                              ftp.storbinary(f"STOR {rpath}", f)
                          ok += 1
                      except Exception as e:
                          fail += 1
                          if fail <= 5:
                              print(f"FAIL {rpath}: {e}")
                      if (ok + fail) % 100 == 0:
                          elapsed = time.time() - t0
                          rate = (ok + fail) / max(elapsed, 1)
                          print(f"  ... {ok + fail}/{total}  ({rate:.1f}/s)")
              elapsed = time.time() - t0
              print(f"OK={ok}  FAIL={fail}  in {elapsed:.1f}s")
          except Exception as e:
              print(f"::error::FTPS upload failed: {e}")
              sys.exit(1)
          finally:
              if ftp is not None:
                  try:
                      ftp.quit()
                  except Exception:
                      pass
          if fail > 10:
              sys.exit(1)
          PYEOF
          # Cleanup uploaded zip via UAPI
          curl -sS -o /dev/null -w "delete zip HTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: cpanel keluhkam:${{ secrets.JKC_CPANEL_TOKEN }}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "files=${FTP_DIR}/${BUNDLE_FILE}" \
            "https://${FTP_HOST}:2083/execute/Fileman/delete_files" || true
          echo "✓ FTPS upload OK"

      - name: Trim extracted bundle (drop heavy/unneeded dirs) and upload per-file
        if: env.FILEMAN_EXTRACT_FUNC == '' && steps.ftp_upload.outcome == 'failure'
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
          BUNDLE_FILE: ${{ env.BUNDLE_FILE }}
        run: |
          set +e
          echo "Extract ${BUNDLE_FILE} locally, trim, then upload per-file via UAPI save_file (parallel x8)"
          # 1. Extract zip
          rm -rf extracted
          mkdir -p extracted
          if ! unzip -q "${BUNDLE_FILE}" -d extracted/; then
            echo "::error::unzip lokal gagal"
            exit 1
          fi
          if [[ -f "extracted/server.js" ]]; then
            SRC="extracted"
          elif [[ -d "extracted/deploy" && -f "extracted/deploy/server.js" ]]; then
            SRC="extracted/deploy"
          else
            SRC=$(find extracted -name "server.js" -type f | head -1 | xargs dirname)
          fi
          echo "Using SRC=${SRC}"
          if [[ ! -f "${SRC}/server.js" ]]; then
            echo "::error::server.js tidak ada"
            exit 1
          fi
          # 2. Trim: drop heavy/unneeded paths.
          # node_modules bisa ribuan files (sourcemaps/README/.map).
          # Production only butuh compiled JS + .prisma engines.
          echo "Trimming unused files..."
          find "${SRC}" -type f \( \
            -name "*.map" -o \
            -name "*.tsbuildinfo" -o \
            -name "*.md" -o \
            -name "*.bak" -o \
            -name "*.d.ts" -o \
            -path "*/node_modules/*/test/*" -o \
            -path "*/node_modules/*/tests/*" -o \
            -path "*/node_modules/*/changelog*" -o \
            -path "*/node_modules/*/CHANGELOG*" -o \
            -path "*/node_modules/*/readme.md" -o \
            -path "*/node_modules/*/README.md" -o \
            -path "*/node_modules/.bin" -o \
            -path "*/node_modules/*/man/*" -o \
            -path "*/node_modules/*/manpages/*" \
          \) -delete 2>/dev/null
          TOTAL=$(find "${SRC}" -type f | wc -l)
          echo "Total files to upload (after trim): ${TOTAL}"
          # 3. Build upload list.
          find "${SRC}" -type f -print0 > /tmp/upload_list.bin
          wc -c /tmp/upload_list.bin
          # 4. Upload per-file via UAPI save_file (PARALLEL x8 with xargs).
          export CPANEL_HOST CPANEL_USER CPANEL_TOKEN CPANEL_DIR SRC
          upload_one() {
            local filepath="$1"
            local rel="${filepath#${SRC}/}"
            local parent=$(dirname "${rel}")
            local name=$(basename "${rel}")
            local parent_dir="${CPANEL_DIR}"
            [[ "${parent}" != "." ]] && parent_dir="${CPANEL_DIR}/${parent}"
            local code="000" i=0
            while (( i < 3 )); do
              code=$(curl -sS -o /tmp/sf_resp_$$ -w "%{http_code}" \
                -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
                --data-urlencode "dir=${parent_dir}" \
                --data-urlencode "file=${name}" \
                --data-urlencode "content@${filepath}" \
                --data-urlencode "encoding=utf-8" \
                "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
              if [[ "$code" == "200" ]] && ! grep -qE '"failed"\s*:\s*[1-9]|"status"\s*:\s*0' /tmp/sf_resp_$$ 2>/dev/null; then
                printf "OK\t%s\n" "${rel}"
                return 0
              fi
              i=$((i+1))
              sleep 1
            done
            printf "FAIL\t%s\t%s\n" "${rel}" "${code}"
            return 1
          }
          export -f upload_one
          echo "Starting parallel upload (8 workers, 3 retries each)..."
          rm -f /tmp/upload_results.txt
          xargs -0 -n 1 -P 8 -I {} bash -c 'upload_one "$@"' _ {} < /tmp/upload_list.bin > /tmp/upload_results.txt 2>&1
          OK=$(grep -c "^OK" /tmp/upload_results.txt 2>/dev/null || echo 0)
          FAIL=$(grep -c "^FAIL" /tmp/upload_results.txt 2>/dev/null || echo 0)
          echo "Uploaded OK=${OK}  FAIL=${FAIL}  (total ${TOTAL})"
          if [[ "$FAIL" -gt 0 ]]; then
            echo "First 10 failures:"
            grep "^FAIL" /tmp/upload_results.txt | head -10
          fi
          # 5. Cleanup uploaded zip.
          curl -sS -o /dev/null -w "delete zip HTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "files=${CPANEL_DIR}/${BUNDLE_FILE}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/delete_files" || true
          if [[ "$FAIL" -gt 10 ]]; then
            echo "::error::${FAIL} files gagal upload — too many failures"
            exit 1
          fi
          # 6. Verify BUILD_ID matches local.
          LOCAL_BUILD=$(cat "${SRC}/.next/BUILD_ID")
          REMOTE_RESP=$(curl -sS \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/get_file?dir=${CPANEL_DIR}/.next&file=BUILD_ID")
          REMOTE_BUILD=$(echo "${REMOTE_RESP}" | grep -oE '"data":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Local BUILD_ID:  ${LOCAL_BUILD}"
          echo "Remote BUILD_ID: ${REMOTE_BUILD}"
          if [[ -z "${REMOTE_BUILD}" ]]; then
            echo "::warning::Gagal baca BUILD_ID dari server — skip verify"
          elif [[ "${REMOTE_BUILD}" != "${LOCAL_BUILD}" ]]; then
            echo "::error::BUILD_ID tidak cocok — upload belum lengkap"
            exit 1
          fi
          echo "✓ Upload OK"

      - name: Extract zip via UAPI Fileman function (if probe found one)
        if: env.FILEMAN_EXTRACT_FUNC != ''
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
          BUNDLE_FILE: ${{ env.BUNDLE_FILE }}
          EXTRACT_FUNC: ${{ env.FILEMAN_EXTRACT_FUNC }}
        run: |
          set +e
          echo "Extract via UAPI Fileman::${EXTRACT_FUNC} (fast path)"
          ext_code=$(curl -sS -o /tmp/extract_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "source=${CPANEL_DIR}/${BUNDLE_FILE}" \
            --data-urlencode "destination=${CPANEL_DIR}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/${EXTRACT_FUNC}")
          echo "extract HTTP ${ext_code}"
          cat /tmp/extract_resp
          echo ""
          if [[ "$ext_code" != "200" ]] || grep -qE '"failed"\s*:\s*[1-9]|"status"\s*:\s*0|"errors"' /tmp/extract_resp 2>/dev/null; then
            echo "::error::UAPI extract gagal"
            exit 1
          fi
          # Verify server.js
          sleep 2
          LOCAL_BUILD=$(cat .next/BUILD_ID)
          REMOTE_RESP=$(curl -sS \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/get_file?dir=${CPANEL_DIR}/.next&file=BUILD_ID")
          REMOTE_BUILD=$(echo "${REMOTE_RESP}" | grep -oE '"data":"[^"]*"' | head -1 | cut -d'"' -f4)
          echo "Local BUILD_ID:  ${LOCAL_BUILD}"
          echo "Remote BUILD_ID: ${REMOTE_BUILD}"
          if [[ "${REMOTE_BUILD}" != "${LOCAL_BUILD}" ]]; then
            echo "::error::BUILD_ID tidak cocok"
            exit 1
          fi
          # Cleanup zip
          curl -sS -o /dev/null -w "delete zip HTTP %{http_code}\n" \
            -X POST \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "files=${CPANEL_DIR}/${BUNDLE_FILE}" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/delete_files" || true
          echo "✓ Extract via ${EXTRACT_FUNC} OK"

      - name: Trigger Passenger restart (touch tmp/restart.txt)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
        run: |
          echo "Touching tmp/restart.txt to restart Passenger..."
          http_code=$(curl -sS -o /tmp/restart_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${CPANEL_DIR}/tmp" \
            --data-urlencode "file=restart.txt" \
            --data-urlencode "content=" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          [[ -s /tmp/restart_resp ]] && { echo "resp:"; head -c 300 /tmp/restart_resp; echo; }

      - name: Write .env to server
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
          CPANEL_DIR: ${{ secrets.JKC_FTP_DIR }}
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_MODEL_FAST: ${{ secrets.AI_MODEL_FAST }}
          AI_MODEL_REVIEW: ${{ secrets.AI_MODEL_REVIEW }}
          REFERENCE_CACHE_ADMIN_TOKEN: ${{ secrets.REFERENCE_CACHE_ADMIN_TOKEN }}
          UPLOAD_DIR: /home/keluhkam/public_html/keluhkampus.my.id/uploads
        run: |
          echo "Writing .env to ${CPANEL_DIR}/.env..."
          {
            echo "NODE_ENV=${NODE_ENV}"
            echo "DATABASE_URL=${DATABASE_URL}"
            echo "DIRECT_URL=${DIRECT_URL}"
            echo "AUTH_JWT_SECRET=${AUTH_JWT_SECRET}"
            echo "NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL}"
            echo "AI_API_KEY=${AI_API_KEY}"
            echo "AI_BASE_URL=${AI_BASE_URL}"
            echo "AI_MODEL=${AI_MODEL}"
            echo "AI_MODEL_FAST=${AI_MODEL_FAST}"
            echo "AI_MODEL_REVIEW=${AI_MODEL_REVIEW}"
            echo "REFERENCE_CACHE_ADMIN_TOKEN=${REFERENCE_CACHE_ADMIN_TOKEN}"
            echo "UPLOAD_DIR=${UPLOAD_DIR}"
            echo "PORT=3000"
            echo "HOSTNAME=0.0.0.0"
          } > /tmp/env_content
          http_code=$(curl -sS -o /tmp/env_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=${CPANEL_DIR}" \
            --data-urlencode "file=.env" \
            --data-urlencode "content@/tmp/env_content" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          [[ -s /tmp/env_resp ]] && { echo "resp:"; head -c 300 /tmp/env_resp; echo; }
          if [[ "$http_code" != "200" ]] || grep -qi '"errors"' /tmp/env_resp; then
            echo "::error::Failed to write .env"
            exit 1
          fi

      - name: Write public_html/.htaccess (reverse proxy ke Node:3000)
        env:
          CPANEL_HOST: ${{ secrets.JKC_FTP_HOST }}
          CPANEL_USER: keluhkam
          CPANEL_TOKEN: ${{ secrets.JKC_CPANEL_TOKEN }}
        run: |
          echo "Writing public_html/.htaccess (Apache reverse proxy ke Node)..."
          http_code=$(curl -sS -o /tmp/htaccess_resp -w "%{http_code}" \
            -H "Authorization: cpanel ${CPANEL_USER}:${CPANEL_TOKEN}" \
            --data-urlencode "dir=/public_html" \
            --data-urlencode "file=.htaccess" \
            --data-urlencode "content@public/.htaccess" \
            --data-urlencode "encoding=utf-8" \
            "https://${CPANEL_HOST}:2083/execute/Fileman/save_file")
          echo "HTTP $http_code"
          [[ -s /tmp/htaccess_resp ]] && { echo "resp:"; head -c 300 /tmp/htaccess_resp; echo; }
          if [[ "$http_code" != "200" ]] || grep -qi '"errors"' /tmp/htaccess_resp; then
            echo "::error::Failed to write public_html/.htaccess"
            exit 1
          fi

      - name: Health check
        run: |
          sleep 20
          echo "Checking https://keluhkampus.my.id/"
          curl -sf -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" \
            https://keluhkampus.my.id/ \
            || echo "::warning::Health check failed"

      - name: Summary
        if: always()
        run: |
          echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${GITHUB_REF_NAME}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY