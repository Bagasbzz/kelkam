name: Deploy to Server via SSH

on:
  push:
    branches:
      - main
  workflow_dispatch: # Memungkinan trigger manual dari tab Actions di GitHub

jobs:
  deploy:
    name: Build & Deploy via SSH
    runs-on: ubuntu-latest
    environment: SSH_SERVER

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: ⚙️ Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"

      - name: 🏗️ Build Next.js (Standalone)
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: "https://keluhkampus.my.id"

      - name: 📁 Prepare Standalone Bundle
        run: |
          # 1. Salin static assets & public ke dalam standalone (standar resmi Next.js)
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/

          # 2. Siapkan folder deployment
          mkdir -p deploy/tmp
          
          # Salin seluruh struktur .next/standalone sehingga entry point .next/standalone/server.js tersedia
          mkdir -p deploy/.next
          cp -r .next/standalone deploy/.next/
          
          # Salin juga static assets & public ke root deploy sebagai fallback proxy Apache
          cp -r .next/static deploy/.next/
          cp -r public deploy/
          
          # Salin prisma schema, package.json, dan server.js custom
          cp -r prisma deploy/
          cp package.json deploy/package.json
          cp server.js deploy/server.js

          # Buat trigger restart Passenger
          touch deploy/tmp/restart.txt

          # 3. Kompresi ke tar.gz (sangat cepat, hemat bandwidth, & menjaga permission file Linux)
          cd deploy && tar -czf ../deploy.tar.gz . && cd ..


      - name: �🚀 Transfer Bundle via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: ${{ secrets.SSH_DIR }}

      - name: ⚡ Extract & Restart Passenger via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.SSH_DIR }}
            
            # Extract file bundle tanpa menimpa file .env atau folder uploads
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz

            # Apply migrasi Prisma (production-safe, hanya pending migration).
            # DB Postgres cPanel hanya bisa diakses dari server ini, jadi migrasi
            # WAJIB jalan di sini. DATABASE_URL dibaca dari .env.local / .env.
            # Kalau gagal → deploy berhenti, app lama tetap jalan.
            set -e
            # 1) Override dari GitHub secret (opsional, paling pasti).
            if [ -n "${{ secrets.DATABASE_URL }}" ]; then
              export DATABASE_URL="${{ secrets.DATABASE_URL }}"
            fi
            # 2) cPanel "Setup Node.js App" menyimpan env var di script activate nodevenv.
            if [ -z "$DATABASE_URL" ]; then
              for act in "$HOME"/nodevenv/*/*/bin/activate; do
                [ -f "$act" ] || continue
                # shellcheck disable=SC1090
                . "$act" >/dev/null 2>&1 || true
                [ -n "$DATABASE_URL" ] && { echo "env dari $act"; break; }
              done
            fi
            # 3) Fallback: .env.local / .env di folder deploy.
            for f in .env.local .env; do
              if [ -f "$f" ]; then
                while IFS= read -r line; do
                  case "$line" in
                    DATABASE_URL=*|DIRECT_URL=*|"export DATABASE_URL="*|"export DIRECT_URL="*)
                      line="${line#export }"; key="${line%%=*}"; val="${line#*=}"
                      val="${val%\"}"; val="${val#\"}"; val="${val%\'}"; val="${val#\'}"
                      [ -z "$(eval echo \$$key)" ] && export "$key=$val"
                      ;;
                  esac
                done < "$f"
              fi
            done
            export DIRECT_URL="${DIRECT_URL:-$DATABASE_URL}"
            if [ -z "$DATABASE_URL" ]; then
              echo "✗ DATABASE_URL tidak ditemukan di .env.local/.env server"; exit 1
            fi
            echo "DB target: $(echo "$DATABASE_URL" | sed -E 's#://([^:]+):[^@]+@#://\1:****@#')"

            # Pakai node dari Passenger/cPanel kalau ada (nvm / cloudlinux).
            [ -s "$HOME/.nvm/nvm.sh" ] && . "$HOME/.nvm/nvm.sh" >/dev/null 2>&1 || true
            command -v node && node -v

            # Install prisma CLI lokal ke folder deploy (sekali; dicache antar deploy).
            if [ ! -x node_modules/.bin/prisma ]; then
              echo "Install prisma CLI 6.19.3 (sekali) ..."
              npm install --no-save --no-audit --no-fund prisma@6.19.3 @prisma/client@6.19.3
            fi
            node_modules/.bin/prisma migrate status --schema prisma/schema.prisma || true
            node_modules/.bin/prisma migrate deploy --schema prisma/schema.prisma
            echo "✓ Migrasi Prisma selesai"
            set +e
            
            # Pastikan folder tmp ada dan sentuh restart.txt untuk reload Node.js
            mkdir -p tmp
            touch tmp/restart.txt
            
            echo "✓ Deployment complete! Node.js Passenger restarted."
